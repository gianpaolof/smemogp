          __NEXT_DATA__ = {"props":{"appointmentList":[{"slug":"dungeon-egizio-il-arriva-al-museo-egizio-di-torino","category":"","startDate":"1792782000","endDate":null,"image":{"id":"13325","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2026/10/2026_ME_DD_sito-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2026/10/2026_ME_DD_sito-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2026/10/2026_ME_DD_sito-1440x450.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2026/10/2026_ME_DD_sito-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2026/10/2026_ME_DD_sito-scaled.jpg"},"title":"Dungeon Egizio: arriva al Museo Egizio","subtitle":"","description":"<span data-contrast=\"auto\"><strong>Il 23 ottobre 2026, dalle 18.30 alle 22</strong>, il mondo di Dungeons &amp; Dragons arriva al Museo Egizio per una sessione di gioco inedita ambientata nell'antico Egitto: </span><strong>\"Dungeon Egizio. Il gioco che ti porta nel passato\". </strong>\r\n\r\n<span data-contrast=\"auto\">Per concretizzare sempre più la propria mission ed essere un luogo accessibile al più ampio numero di persone, il museo amplia la propria offerta culturale con nuove proposte che reinterpretano in chiave egittologica attività molto amate dalla Generazione Z.</span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">È il caso di Dungeons &amp; Dragons (noto anche come D&amp;D), uno dei giochi di ruolo più celebri dell'universo comics, familiare al grande pubblico anche grazie alla serie tv </span><i><span data-contrast=\"auto\">The Big Bang Theory</span></i><span data-contrast=\"auto\"> (2007-2019).</span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Una delle peculiarità del gioco è l'assenza di una trama fissa: ogni volta è possibile creare una struttura narrativa nuova e personalizzabile. Proprio questa dimensione adattiva ha reso l'attività ideale per avviare una collaborazione tra il Museo Egizio e Goblin Torino – Comics &amp; Games.</span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Le competenze dei Dungeon Master, unite a quanto da loro appreso in un percorso di visita tematico dedicato ai miti dell'antico Egitto, hanno dato vita a una versione unica di D&amp;D, ambientata direttamente nelle sale del museo.</span>\r\n<span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-ccp-props=\"{}\"> </span>\r\n<h2><b><span data-contrast=\"auto\">D&amp;D nelle sale </span></b><b><span data-contrast=\"auto\">del Museo Egizio</span></b><span data-ccp-props=\"{}\"> </span></h2>\r\n<span data-contrast=\"auto\">La </span><strong>Galleria dei Re</strong><span data-contrast=\"auto\">, la </span><strong>Cappella rupestre di Ellesiya</strong><span data-contrast=\"auto\"> e </span><strong>Materia. Forma del tempo</strong><span data-contrast=\"auto\"> ospiteranno otto<strong> postazioni da 6 giocatori e giocatrici ciascuna, per svolgere in contemporanea una sessione di gioco </strong></span><strong><i>oneshot</i>. </strong>\r\n\r\n<span data-contrast=\"auto\">Durante l'attività è possibile avere con sé dell'acqua, ma non cibi e altre bevande.</span>\r\n<span data-ccp-props=\"{}\"> </span>\r\n<h2><b><span data-contrast=\"auto\">Come partecipare</span></b><span data-ccp-props=\"{}\"> </span></h2>\r\n<span data-contrast=\"auto\">La partecipazione al gioco costa </span><strong>6 euro a persona</strong><span data-contrast=\"auto\"><strong>.</strong>\r\n</span><span data-contrast=\"auto\">È possibile anche </span><strong>assistere all'attività gratuitamente</strong><span data-contrast=\"auto\">, ma con<strong> prenotazione obbligatoria.</strong>\r\n</span><span data-contrast=\"auto\">L'ingresso avviene da via Accademia delle Scienze, 6.</span><span data-ccp-props=\"{}\">\r\nL'accesso alle persone di età inferiore ai 16 anni è consentito solo se accompagnate da un adulto.</span>\r\n\r\n<strong>L'acquisto del biglietto o la prenotazione dell'ingresso gratuito, va effettuato attraverso il sito di Goblin Torino, a cui puoi accedere cliccando<em><a href=\"https://goblin-shop.it/categoria-prodotto/eventi-e-tickets/\"> QUI</a>.</em></strong>\r\n\r\nSei pronto o pronta a viaggiare nell'antico Egitto, tira i dadi e preparati a esplorare i miti egizi tra le sale del museo.\r\n\r\nTi aspettiamo!","reservation":"needed","bookingInfo":"","extraInfo":[{"icon":"","title":"","subtitle":""}],"seo":{"title":"D&D al Museo Egizio di Torino: Dungeon Egizio","description":"Il 23 ottobre 2026 Dungeons & Dragons arriva al Museo Egizio di Torino con “Dungeon Egizio”: una sessione di gioco tra miti e sale dell’antico Egitto."},"tag":"Eventi speciali","extraNotes":"","dates":[{"date":"1792782000"}],"datesRange":"0","info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"slug":"13319","category":"","startDate":"1792321200","endDate":null,"image":{"id":"12810","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-1440x450.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-scaled.jpg"},"title":"ONDE – 18 ottobre 2026 – “Sax Appeal: classici e colonne sonore”","subtitle":"","description":"<b><span data-contrast=\"auto\">Domenica 18 ottobre 2026 alle 11,</span></b> vi aspettiamo <strong>in Sala Conferenze</strong> per un nuovo appuntamento con \"ONDE. 12 matinée al Museo Egizio\": <strong>SAX APPEAL: CLASSICI E COLONNE SONORE</strong>, a cura del  <strong>Conservatorio statale di musica \"G. Verdi\" di Torino.</strong>\r\n\r\n<strong>SISS Quartet:</strong>\r\nEmma Rotatori <em>sax soprano</em>\r\nStefano Denaro<em> sax contralto</em>\r\nFabian Gherca <em>sax tenore</em>\r\nValeria Bussacchini <em>sax baritono</em>\r\n\r\n&nbsp;\r\n<div class=\"x_x_elementToProof\">La duttilità è l'aspetto che più di ogni altro ha caratterizzato il sassofono nei suoi 185 anni di vita. Il programma proposto dal quartetto di Sassofoni del Conservatorio mette in luce tale caratteristica, in un'<strong>alternanza di stili e sonorità</strong> che senza bisogno di troppa immaginazione ci aiutano a identificare i contorni di una vera e propria <strong>macchina del tempo</strong>.</div>\r\n<div class=\"x_x_elementToProof\">\r\n\r\n<img class=\"size-medium wp-image-13320\" src=\"https://api.museoegizio.it/wp-content/uploads/2026/10/DSC00672-1024x1024.jpg\" alt=\"\" width=\"300\" height=\"300\" />\r\n\r\n</div>\r\n<div class=\"x_x_elementToProof\"><strong>Il SISS Quartet</strong> (Sax In Several Styles Quartet) nasce nel 2024 dall’incontro di quattro giovani musicisti, tutti allievi del Conservatorio Giuseppe Verdi di Torino: Emma Rotatori (sax soprano), Stefano Denaro (sax contralto), Fabian Gherca (sax tenore) e Valeria Bussacchini (sax baritono).\r\nAttivo nella vivace scena culturale di Torino e del territorio piemontese, il quartetto ha già preso parte a importanti contesti artistici, collaborando con realtà di prestigio quali la Reggia di Venaria, il Circolo dei Lettori, il Torino Film Festival e i Musei Reali.\r\nIl SISS Quartet si distingue per un repertorio ampio e versatile, capace di attraversare stili ed epoche diverse, valorizzando le molteplici possibilità espressive del quartetto di sassofoni.</div>\r\n<div>\r\n\r\nIngresso gratuito con prenotazione obbligatoria, <strong>prenota il tuo posto <a href=\"https://egizio.museitorino.it/eventi/onde-evento-gratuito-con-accompagnamento- A2NTMwOTU0MC4xNzkxNDQ4Nzk3*_ga_TQVES5V6SH*czE3OTE0NDg3OTYkbzEkZzEkdDE3OTE0NDk1OTEkajckbDAkaDA.&amp;keep_tld=true\">QUI</a>.</strong>","reservation":"needed","bookingInfo":"","extraInfo":[{"icon":"","title":"","subtitle":""}],"seo":null,"tag":"Eventi speciali","extraNotes":"","dates":[{"date":"1793210400"}],"datesRange":"0","info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}}],"highlighted":{"slug":"onde-20-settembre-2026-fusioni","category":"","startDate":"1789902000","endDate":null,"image":{"id":"12810","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-1440x450.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2026/06/2026_Onde_28giu_sito-scaled.jpg"},"title":"ONDE – 20 settembre 2026- “Fusioni”","subtitle":"","description":"<b><span data-contrast=\"auto\">Domenica 20 settembre 2026 alle 11,</span></b> vi aspettiamo <strong>in Sala Conferenze</strong> per un nuovo appuntamento con \"ONDE. 12 matinée al Museo Egizio\": <strong>FUSIONI</strong>, a cura dell'<strong>Orchestra Filarmonica di Torino.</strong>\r\n\r\n<strong>Kymeia Duo:</strong>\r\n<p style=\"padding-left: 40px;\"><strong>Serena Costenaro</strong>, violoncello</p>\r\n<p style=\"padding-left: 40px;\"><strong>Fabio Saccavino</strong>, percussioni</p>\r\n<span class=\"TextRun SCXW163263115 BCX8\" lang=\"IT-IT\" xml:lang=\"IT-IT\" data-contrast=\"auto\"><span class=\"NormalTextRun SCXW163263115 BCX8\">Due mondi apparentemente distanti, violoncello e percussioni, trasformati in un unico organismo espressivo, tra minimalismo, lirismo, energia primordiale e scrittura contemporanea. Un programma che esplora il dialogo, <strong>il contrasto e la fusione tra corpo, ritmo e canto,</strong> passando da atmosfere rarefatte a pulsazioni quasi rituali e rivelando <strong>nuove possibilità timbriche e narrative</strong>.</span></span>\r\n\r\n<img class=\"alignnone size-medium wp-image-13181\" src=\"https://api.museoegizio.it/wp-content/uploads/2026/09/IMG-20260907-WA0005_-1024x1024.jpg\" alt=\"\" width=\"300\" height=\"300\" />\r\n\r\n<span data-contrast=\"auto\">Fondato nel 2025, il <strong>Kymeia Duo</strong> nasce dall’incontro tra Serena Costenaro (violoncello) e Fabio Saccavino (percussioni), con l’obiettivo di approfondire e promuovere il repertorio del Novecento e del presente. Attraverso una costante ricerca timbrica, il duo costruisce programmi che mettono in dialogo le principali pagine del repertorio con nuove composizioni e arrangiamenti, valorizzando le potenzialità espressive di un organico ancora poco esplorato. </span><span data-ccp-props=\"{&quot;335559739&quot;:0}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Accanto all’attività concertistica, il duo sviluppa un percorso di ricerca e divulgazione rivolto al pubblico più giovane. Ha ideato e realizzato progetti didattici per la scuola primaria e secondaria, dedicati alla scoperta del violoncello e delle percussioni, intrecciando la storia dei due strumenti con laboratori incentrati sul rapporto tra suono, gesto e segno grafico. Attraverso un approccio interdisciplinare, l’esperienza musicale diventa occasione di esplorazione creativa e di ascolto consapevole.</span>\r\n\r\nIngresso gratuito con prenotazione obbligatoria, <strong>prenota il tuo posto <a href=\"https://egizio.museitorino.it/eventi/onde-evento-gratuito-con-accompagnamento-musicale/\">QUI</a></strong>\r\n<div>I partecipanti, a fine evento, potranno visitare gratuitamente l'ala del Museo <strong>\"Materia. Forma del tempo\".</strong></div>","reservation":"needed","bookingInfo":"","extraInfo":[{"icon":"","title":"","subtitle":""}],"seo":null,"tag":"Eventi speciali","extraNotes":"","dates":[{"date":"1789902000"}],"datesRange":"0","info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},"categories":[{"id":-1,"title":"Tutti gli appuntamenti"},{"id":114,"title":"Conferenze","slug":"conferences"},{"id":113,"title":"Eventi speciali","slug":"special-events"},{"id":116,"title":"Il Museo fuori dal Museo","slug":"museum-insideout"},{"id":115,"title":"Mostre temporanee","slug":"temporary-exibith"},{"id":117,"title":"Passeggiate del Direttore","slug":"director-walk"},{"id":112,"title":"Visite guidate e laboratori","slug":"guided-tours-and-workshops"}],"asPath":"/esplora/appuntamenti/","appointmentsPageDetail":{"date":"","image_Header":"","title":"","subtitle":"","seo":{"title":"Appuntamenti - Museo Egizio","description":"Scopri le conferenze, gli eventi e tutte le iniziative speciali"},"id":"","highlighted":"13180","quote":{"title":"Io credo nei musei come centri di ricerca, come una agorà aperta, capaci di programmare e di crearsi nuove possibilità di crescita.","author":"Christian Greco","desc":"Direttore Museo Egizio"}}},"pathname":"/appointments","query":{}}
