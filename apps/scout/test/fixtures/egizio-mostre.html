<!DOCTYPE html><html lang="it"><head><title>Museo Egizio</title></head><body><div id="__next"></div><div><script>
          __NEXT_DATA__ = {"props":{"exhibitionList":[{"headerImage":{"id":"13295","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-1440x450.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-scaled.jpg"},"slug":"ultrasky-alla-scoperta-del-blu-egizio-dalle-arti-alle-scienze","title":"Ultrasky. Alla scoperta del blu egizio dalle arti alle scienze","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1791849600000,"endDate":1797274800000,"isRange":false,"description":"<h2><strong>Ultrasky. Il blu egizio incontra l’arte contemporanea </strong></h2>\r\n<span data-contrast=\"auto\">Che cosa accade quando un materiale creato più di cinquemila anni fa entra nelle pratiche dell’arte contemporanea?</span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">È da questo incontro che prende forma </span><strong><em>Ultrasky. Alla scoperta del blu egizio dalle arti alle scienze</em></strong><span data-contrast=\"auto\">, progetto espositivo di BLUENET che, dopo aver attraversato diverse sedi in Italia, giunge al Museo Egizio per la sua tappa conclusiva, realizzata con il contributo scientifico del Museo. </span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span>\r\n\r\n<strong>Dal 13 ottobre al 14 dicembre 2026, <em>Ultrasky</em></strong><span data-contrast=\"none\"><strong> porta nelle sale otto artiste e artisti contemporanei</strong> chiamati a confrontarsi con uno dei materiali più affascinanti nati nell’antico Egitto: il <strong>blu egizio. </strong></span><strong> </strong>\r\n\r\n<span data-contrast=\"none\">Il blu egizio diventa il punto di partenza per sperimentare tecniche, forme e linguaggi artistici diversi: dalla scultura al mosaico, dal vetro al tessuto, fino alla stampa 3D.</span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"none\">Non si tratta di riprodurre l’arte dell’antico Egitto, ma di partire da una sua straordinaria invenzione per continuare a trasformarla. Lo stesso materiale che attraversa la storia delle collezioni del Museo entra così nelle pratiche della creazione contemporanea, mettendo in relazione tempi, saperi e linguaggi differenti.</span>\r\n\r\n&nbsp;\r\n<h2><b><span data-contrast=\"auto\">Il blu egizio: tra storia e scienza</span></b><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span></h2>\r\n<h3><b><span data-contrast=\"auto\">Le origini in Egitto</span></b><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span></h3>\r\n<span data-contrast=\"auto\">Il <strong>blu egizio è considerato il primo pigmento artificiale creato dall'uomo</strong>. Non veniva estratto da una sostanza naturalmente blu: per produrlo era necessario trasformare diverse materie prime attraverso un processo che richiedeva competenze tecniche specifiche e il controllo del calore.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Il suo principale componente è un<strong> silicato di calcio e rame, la cuprorivaite</strong>. Gli artigiani dell’antico Egitto riuscirono a produrlo artificialmente nelle fornaci e a utilizzarlo in grande quantità. </span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Gli Egizi lo chiamavano </span><em>hesebedj-irit</em><span data-contrast=\"auto\">, “lapislazzuli prodotto”: una definizione che racconta bene la sua natura, perché quel blu era il risultato di un processo tecnico. Attraverso la trasformazione della materia si rendeva disponibile un colore associato anche al cielo, al sacro e alla dimensione divina. </span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Ma come veniva realizzato il blu egizio? Ce lo spiega Marco Nicola, uno dei curatori della mostra <a href=\"https://www.youtube.com/watch?v=uwsIHqS7QQ4\">QUI</a>.</span>\r\n\r\n&nbsp;\r\n<h2><b><span data-contrast=\"auto\">Un materiale in viaggio</span></b><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;335551550&quot;:6,&quot;335551620&quot;:6,&quot;335559738&quot;:240,&quot;335559739&quot;:240}\"> </span></h2>\r\n<span data-contrast=\"auto\">La conoscenza necessaria a produrlo ha avuto una storia lunga e non lineare: <strong>nato in Egitto più di 5.000 anni fa</strong>, raggiunse la Mesopotamia e il mondo egeo, si diffuse nel Mediterraneo e con Roma conobbe la sua massima espansione. Il suo utilizzo diminuì nei secoli successivi, senza però scomparire del tutto: ne restano testimonianze medievali e alcune rare riapparizioni nel Rinascimento. Dopo una nuova interruzione, nell’Ottocento la scienza moderna tornò a studiarne composizione e tecniche di produzione, aprendo una nuova fase della sua storia.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;335551550&quot;:6,&quot;335551620&quot;:6,&quot;335559738&quot;:240,&quot;335559739&quot;:240}\"> </span>\r\n\r\n&nbsp;\r\n<h2><b><span data-contrast=\"auto\">Una storia che continua ancora oggi</span></b><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;335551550&quot;:6,&quot;335551620&quot;:6,&quot;335559738&quot;:240,&quot;335559739&quot;:240}\"> </span></h2>\r\n<span data-contrast=\"auto\">Ma la storia del blu egizio continua ancora oggi.<strong> La ricerca ne ha infatti rivelato proprietà che vanno ben oltre ciò che possiamo osservare a occhio nudo</strong>: esposto alla luce visibile, il pigmento emette una forte luminescenza nel vicino infrarosso. Gli studi più recenti hanno inoltre dimostrato che può essere trasformato in nanolamelle estremamente sottili, aprendo nuove possibilità di ricerca in ambiti come il </span><em>bioimaging</em><span data-contrast=\"auto\"> e la medicina rigenerativa.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;335551550&quot;:6,&quot;335551620&quot;:6,&quot;335559738&quot;:240,&quot;335559739&quot;:240}\"> </span>\r\n\r\n<span data-contrast=\"auto\"><strong>Un materiale nato nell’antichità, quindi, continua a offrire nuove possibilità nel presente.</strong> Ed è proprio questa capacità di attraversare il tempo a diventare il terreno di sperimentazione degli artisti di Ultrasky.</span><span data-ccp-props=\"{}\"> </span>\r\n\r\n&nbsp;\r\n<h2><b><span data-contrast=\"auto\">Dalla ricerca scientifica alla sperimentazione artistica</span></b><span data-ccp-props=\"{}\"> </span></h2>\r\n<span data-contrast=\"auto\">Le nuove possibilità offerte dal blu egizio non si esplorano soltanto nei laboratori scientifici. Con </span><i><span data-contrast=\"auto\">Ultrasky</span></i><span data-contrast=\"auto\">, <strong>un materiale nato più di cinquemila anni fa diventa anche terreno di sperimentazione per l’arte contemporanea.</strong></span><strong> </strong>\r\n\r\n<span data-contrast=\"auto\">Le <strong>nove opere riunite nella mostra non cercano di riprodurre gli usi antichi del pigmento, ma ne esplorano proprietà e potenzialità attraverso linguaggi, tecniche e materiali differenti.</strong> Il blu egizio viene incorporato nel vetro, applicato ai tessuti, mescolato alla pittura, utilizzato nel mosaico e nella stampa 3D o trasformato esso stesso in materia scultorea. Nove diverse ricerche artistiche partono così dallo stesso materiale per portarlo in direzioni profondamente diverse:</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559738&quot;:240,&quot;335559739&quot;:240}\"> </span>\r\n\r\n<strong>Viola Alpi</strong><span data-contrast=\"auto\"> porta il pigmento nel mondo del tessile. In </span><em>Sciarpa Ultrasky</em><span data-contrast=\"auto\"> interviene su un capo storico della collezione Filippo Alpi applicando un’etichetta anticontraffazione trattata con blu egizio. </span><span data-contrast=\"none\">La presenza del più antico pigmento sintetico conosciuto introduce un dialogo tra patrimonio culturale, innovazione scientifica e manifattura d'eccellenza, inscrivendo il gesto creativo contemporaneo in una continuità di saperi che attraversa i millenni.</span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Con il collettivo </span><strong>CaCO₃</strong><span data-contrast=\"auto\">, il blu egizio incontra invece il micromosaico. Nelle opere </span><em>Blu Egizio n2, n3 e n4</em><span data-contrast=\"auto\">, tessere, terracotta, pigmento, cotto, malta e altri materiali costruiscono superfici in cui la tradizione millenaria dell'arte musiva diventa terreno di sperimentazione ottica, materica e percettiva.  </span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<strong>Andrea Chidichimo</strong><span data-contrast=\"auto\"> lavora sul rapporto tra ciò che vediamo e ciò che può rivelarsi soltanto attraverso altri strumenti di osservazione. In </span><i><span data-contrast=\"auto\">St.Art</span></i><span data-contrast=\"auto\"> il blu egizio è nascosto all'interno della pittura a olio e l'opera si rivela pienamente attraverso indagini VIL: indossando il visore (VIL) per la lettura dell’emissione infrarossa del blu egizio, ci si accorge che il dipinto scompare per lasciare il posto a un cielo stellato; in </span><em>Horus Laboris</em><span data-contrast=\"auto\">, invece, il pigmento diventa protagonista di un monocromo a olio interamente realizzato con blu egizio. </span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Nella ricerca di </span><strong>Stefano Conticelli</strong><span data-contrast=\"auto\">, il blu egizio incontra la scultura e materiali naturali. </span><em>Diego Sanzio</em><span data-contrast=\"auto\"> accosta il pigmento al granito nero assoluto dello Zimbabwe, all'interno di una pratica che intreccia arte, design, natura e sperimentazione sui materiali. </span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<strong>Giuliano Giuman</strong><span data-contrast=\"auto\"> incorpora invece polvere di blu egizio e sabbia del Sinai nella vetrofusione. </span><em>Pietra Filosofale</em><span data-contrast=\"auto\">, non è qui intesa come un oggetto capace di mutare i metalli in oro, ma come simbolo della trasformazione interiore: Il Blu Egizio richiama il cielo, il divino e la conoscenza; la sabbia del Sinai rappresenta il deserto, il cammino e la prova. Il vetro li unisce in una forma fragile e insieme eterna, dove trasparenza e opacità convivono come gli opposti della natura umana. </span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<strong>Matteo Peducci</strong><span data-contrast=\"auto\"> mette invece alla prova il blu egizio come vera e propria materia scultorea. </span><em>Flauto d'Egitto</em><span data-contrast=\"auto\"> è ricavato da un blocco di blu egizio: il pigmento non è quindi utilizzato soltanto per dare colore a una superficie, ma diventa esso stesso il materiale da lavorare. La ricerca di Peducci indaga così le proprietà strutturali, formali e persino acustiche della materia, facendo dialogare tecniche scultoree tradizionali e nuovi materiali. </span><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">In </span><em>Blue is Blue</em><span data-contrast=\"auto\">,</span> <strong>Erica Tamborini</strong><span data-contrast=\"auto\"> utilizza puro pigmento di blu egizio per comporre la scritta che dà il titolo all’opera, sostenuta da una struttura metallica. Il riferimento è alle antiche iscrizioni lapidee riempite di pigmento, ma qui la pietra scompare e resta soltanto il colore. L’opera mette così in relazione una tecnica millenaria con il presente, riflettendo su ciò che resta – o si perde – nel tempo. Mentre nell’installazione </span><em>Un chilo di argilla tra le mie mani</em><span data-contrast=\"auto\">, il blu egizio compare sotto forma di smalto su ciotole modellate in argilla bianca. La ripetizione del gesto della tornitura mette in relazione una pratica antica con il presente, trasformando ogni ciotola in una traccia del tempo e delle mani che l’hanno plasmata.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559738&quot;:240,&quot;335559739&quot;:240}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Infine, </span><strong>Franco Vitelli</strong><span data-contrast=\"auto\">, in </span><em>Inganno</em><span data-contrast=\"auto\">, reinterpreta la tradizione del mosaico attraverso paste vitree blu, tessere dorate e palombino, creando un’opera contemporanea dall’apparenza antica. Al centro, uno specchio accoglie il riflesso di chi osserva, modificando continuamente la composizione. L’“inganno” nasce così dall’incontro tra memoria, materia e presente.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;335559738&quot;:240,&quot;335559739&quot;:240}\"> </span>\r\n\r\n&nbsp;\r\n<h2><b><span data-contrast=\"auto\">Lo stesso blu, nuovi linguaggi</span></b><span data-ccp-props=\"{}\"> </span></h2>\r\n<span data-contrast=\"auto\">Nelle sale del Museo Egizio, le opere di </span><i><span data-contrast=\"auto\">Ultrasky</span></i><span data-contrast=\"auto\"> riportano il blu egizio nel luogo in cui è possibile seguirne la storia più antica. E lo fanno interrogando il passato, con nuove domande, tecniche e processi creativi contemporanei. A più di cinquemila anni dalla sua invenzione, il blu egizio torna a essere materia di sperimentazione.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span>\r\n\r\n&nbsp;\r\n<h2><b><span data-contrast=\"auto\">Il catalogo di Ultrasky</span></b><span data-ccp-props=\"{}\"> </span></h2>\r\n<span data-contrast=\"auto\">Il catalogo della mostra ripercorre il progetto e le sue diverse tappe, approfondendo la storia e la tecnologia del blu egizio, le ricerche scientifiche sulle sue proprietà e le sperimentazioni artistiche che hanno dato forma alla mostra, raccontando incontri e collaborazioni sviluppati lungo il percorso.</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Puoi acquistarlo al Museum Shop o a<strong> <a href=\"https://shop.museoegizio.it/\">QUI</a>.</strong></span>\r\n\r\n<span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">ULTRASKY. </span><em>Alla scoperta del blu egizio, dalle arti alle scienze</em><span data-ccp-props=\"{}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Un progetto di Bluenet, in collaborazione con il Museo Egizio</span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span>\r\n\r\n<span data-contrast=\"auto\">Museo Egizio | 13 ottobre – 14 dicembre 2026. </span><span data-ccp-props=\"{&quot;134233117&quot;:false,&quot;134233118&quot;:false,&quot;201341983&quot;:0,&quot;335551550&quot;:1,&quot;335551620&quot;:1,&quot;335559685&quot;:0,&quot;335559737&quot;:0,&quot;335559738&quot;:0,&quot;335559739&quot;:160,&quot;335559740&quot;:259}\"> </span><span data-ccp-props=\"{}\"> </span>","urlVideo":"","tag":"","seo":{"title":"Ultrasky: il blu egizio tra arte e scienza | Museo Egizio","description":"Dal 13 ottobre al 14 dicembre 2026, Ultrasky al Museo Egizio di Torino racconta il blu egizio tra storia, scienza e arte contemporanea."},"highlighedText":"","image":{"id":"13295","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-1440x450.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2026/10/Mostra-Ultrasky-Museo-Egizio-scaled.jpg"},"imageTitle":"","current":true,"info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"12146","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-1440x450.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-scaled.jpg"},"slug":"da-parigi-per-kha-e-merit-due-capolavori-in-prestito-per-il-120-anniversario-dalla-scoperta-della-tomba","title":"Da Parigi per Kha e Merit","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1771059600000,"endDate":1786370400000,"isRange":false,"description":"Il <strong>15 febbraio 2026</strong>, il <strong>Museo Egizio</strong> celebra i <strong>120 anni dalla scoperta della tomba di Kha e Merit, </strong>uno dei ritrovamenti più importanti dell’archeologia egiziana per lo stato di conservazione e la completezza del corredo funerario.\r\n\r\nIn occasione di questo importante anniversario, per la prima volta e solo <strong>dal 14 febbraio al 17 agosto 2026</strong>, due importanti prestiti da Parigi, provenienti dalla tomba di Kha e Merit, sono esposti al Museo Egizio. Il papiro di Merit, rimasto a Torino fino ad <strong>agosto 2026</strong>, è ora disponibile al pubblico attraverso una <a href=\"https://museoegizio.it/esplora/notizie/vietato-non-toccare-il-libro-dei-morti-di-merit-diventa-tattile/\"><strong>riproduzione tattile</strong></a>, mentre il pyramidion sarà visibile fino a <strong>febbraio 2027</strong>.\r\n\r\nSi tratta del <strong>Pyramidion con il nome di Kha</strong>, appartenente alle collezioni del <strong><em>Musée du Louvre</em></strong>, e del<strong> Libro dei Morti di Merit</strong> della <strong><em>Bibliothèque nationale de France.</em></strong>\r\n\r\nGrazie al <strong>lavoro di ricerca e di collaborazione tra le tre istituzioni</strong>, è possibile per la prima volta ammirare questi reperti in dialogo con i più importanti oggetti ritrovati nella tomba di Kha e Merit.\r\n\r\nLa mostra è situata in sala 7, inserita nel percorso museale dedicato alla tomba di Kha e Merit.\r\n\r\nScopri di più sui reperti della mostra <a href=\"https://www.museoegizio.it/esplora/notizie/da-parigi-per-kha-e-merit-due-capolavori-in-prestito-per-il-120-anniversario-della-scoperta-della-tomba/\">QUI</a>\r\n\r\nAcquista il tuo biglietto <a href=\"https://egizio.museitorino.it/\">QUI</a>","urlVideo":"","tag":"","seo":null,"highlighedText":"","image":{"id":"12146","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-1440x450.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2026/02/KM_15FEB_VISUAL_OK-23-scaled.jpg"},"imageTitle":"","current":true,"info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"10550","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3-500x250.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3.jpg"},"slug":"carlo-felice-la-nascita-del-museo-egizio","title":"Carlo Felice. La nascita del Museo Egizio","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1732093200000,"endDate":1736706600000,"isRange":true,"description":"<strong>Visitabile fino al 12 gennaio 2025</strong>,  la mostra, a cura di Enrico Barbero, racconta il <strong>ruolo del re Carlo Felice di Savoia nella fondazione del Museo Egizio di Torino</strong>. Salito al trono nel 1821, Carlo Felice completò nel 1823 l’acquisto della collezione del console Bernardino Drovetti, trasformando Torino in una capitale culturale europea.\r\n\r\nIn esposizione, ritratti di membri di Casa Savoia, tra cui il busto in bronzo di Carlo Felice (1827) dai Musei di Cagliari e quello in gesso di Maria Cristina di Borbone (1826) dal Castello di Racconigi, entrambi opera di Andrea Galassi. Accanto a questi vi sono gli arredi egittizzanti come lo scrittoio a ribalta di Palazzo Chiablese e l’inginocchiatoio del Castello di Agliè, che testimoniano il gusto per lo stile diffusosi in Europa dopo la campagna napoleonica in Egitto.\r\n\r\nLa mostra illustra anche il <strong>mecenatismo artistico e l’interesse archeologico della coppia reale</strong>, documentato da reperti romani provenienti dagli scavi di Tuscolo e Veio, che arricchirono le collezioni sabaude.\r\n\r\nVenite a scoprire come è nata la collezione di antichità egizie di Torino, oltre due secoli fa, dalla volontà di Casa Savoia di nobilitare con origini mitologiche la città.\r\n\r\n<img class=\"alignnone size-medium wp-image-10552\" src=\"https://api.museoegizio.it/wp-content/uploads/2024/11/468518985_973123001509721_7409884617542412680_n-1024x800.jpg\" alt=\"\" width=\"300\" height=\"234\" />","urlVideo":"","tag":"","seo":null,"highlighedText":"","image":{"id":"10550","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3-500x250.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2024/11/FORMAT-PRESENTAZIONE-EDITORIALE_ORIZZONTALE_HEADERSITO-3.jpg"},"imageTitle":"","current":false,"info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"9787","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF-1024x800.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF.jpg"},"slug":"verso-la-nuova-galleria-dei-re","title":"Verso la nuova Galleria dei Re","subtitle":"Museo Egizio e Accademia delle Scienze","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1713862800000,"endDate":1730745000000,"isRange":true,"description":"<strong>Dal 23 aprile 2024 dei e faraoni accolgono </strong><strong>i visitatori </strong><strong>all’ingresso del Museo Egizio e dell’Accademia delle Scienze.</strong>\r\n\r\nLe <strong>statue della Galleria dei Re</strong> sono le protagoniste di un allestimento temporaneo - frutto della collaborazione tra Museo Egizio e Accademia delle Scienze - che<strong> offre una suggestione dell’origine del Museo</strong>, 200 anni fa, quando arrivarono a Torino le grandi sculture di faraoni e divinità.\r\n\r\nLa mostra sarà visitabile <strong>fino al 4 novembre 2024.</strong>\r\n\r\n<img class=\"size-medium wp-image-9789 aligncenter\" src=\"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3432-NEF-908x1024.jpg\" alt=\"\" width=\"266\" height=\"300\" />\r\n\r\nLe statue, infatti, nel 1823 varcarono la soglia del palazzo barocco che oggi ospita il Museo Egizio e l’Accademia delle Scienze, assieme a migliaia di reperti della collezione Drovetti, e furono sistemate al piano terreno e nella corte. Un anno dopo nacque a Torino il primo Museo Egizio al mondo.\r\n\r\n<strong>L’allestimento richiama la posizione delle statue nei cortili dei grandi templi dell’antico Egitto</strong>, dove le divinità e i faraoni, pur manifestando la propria ieraticità e autorevolezza, mantenevano uno stretto legame con i fedeli.\r\n\r\nSi tratta di un'occasione unica per <strong>cogliere dettagli dei reperti che prima non erano fruibili</strong>, come le iscrizioni geroglifiche sulla parte alta del trono della statua di Tutmosi I o come la parte posteriore del copricapo del sovrano Horemheb o ancora il suo naso, che da lontano dà la falsa impressione di essere all’insù a causa di un restauro ottocentesco.\r\n\r\n<img class=\"size-medium wp-image-9791 aligncenter\" src=\"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3411-NEF-791x1024.jpg\" alt=\"\" width=\"232\" height=\"300\" />\r\n\r\nLa mostra è anche l’occasione per fare il punto sull’evoluzione degli <strong>allestimenti delle statue al Museo</strong> in due secoli di storia e per riportare l’attenzione sui documenti ottocenteschi di una delle collezioni egittologiche più importanti al mondo, custoditi e visibili al Museo e all’Accademia delle Scienze.\r\n\r\nLungo il percorso espositivo sono richiamati i momenti salienti dell'esposizione dei reperti monumentali della collezione. All’Accademia delle Scienze sono invece conservate alcune lettere del padre dell’egittologia Jean François Champollion, i carnet di viaggio di Carlo Vidua e altri documenti che hanno permesso di ricostruire l’intreccio di vicende e personaggi storici e accademici che contribuirono a dare i natali al Museo Egizio.","urlVideo":"","tag":"","seo":null,"highlighedText":"","image":{"id":"9787","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF-1024x800.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2024/04/DSC3423-NEF.jpg"},"imageTitle":"","current":false,"info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"6103","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49-1440x959.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49-1654x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49.jpg"},"slug":"il-dono-di-thot-leggere-lantico-egitto","title":"Il Dono di Thot: leggere l’antico Egitto","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1670403600000,"endDate":1694111400000,"isRange":true,"description":"Nell’anno 2022 ricorre il <strong>bicentenario della decifrazione dei geroglifici</strong> da parte di Jean-François Champollion. Questo evento storico segna la nascita dell’egittologia moderna e il Museo Egizio lo celebra con una <strong>mostra dedicata interamente alle scritture e alla lingua della civiltà egizia</strong>. Secondo il mito, fu il dio Thot a ideare l’arte della scrittura, divenendo patrono della conoscenza e degli scribi.\r\n\r\nLa scrittura è uno strumento fondamentale per l’amministrazione del paese e, allo stesso tempo, componente essenziale della visione del mondo e dell’immaginario egiziano, veicolo del pensiero religioso e del rito, della rappresentazione del potere regale e dell’identità sociale delle élite.\r\n\r\n\"<em>Il Dono di Thot: Leggere l'antico Egitto\"</em> ripercorre l’<strong>evoluzione delle scritture</strong> (ieratico, demotico, copto e geroglifico) e la varietà dei supporti su cui si scriveva, aprendo <strong>una finestra sull’ambiente, il pensiero e la società dell’antico Egitto</strong>.\r\n\r\n<img class=\" wp-image-6080 aligncenter\" src=\"https://api.museoegizio.it/wp-content/uploads/2022/12/IMG-20221205-WA0024.jpg\" alt=\"\" width=\"957\" height=\"638\" />\r\n\r\nSono <strong>170 i reperti in esposizione</strong>, tutti provenienti dalle Collezioni del Museo Egizio, ad eccezione delle tavolette cuneiformi provenienti dai Musei Reali di Torino. In mostra sono esposti papiri, capolavori della statuaria, oggetti in alabastro e statuine lignee, a testimonianza di quella cultura materiale attraverso cui egittologi e storici hanno ricostruito la biografia non solo degli oggetti, ma dell’intera civiltà nilotica.\r\n\r\n<img class=\" wp-image-6079 aligncenter\" src=\"https://api.museoegizio.it/wp-content/uploads/2022/12/IMG-20221205-WA0017.jpg\" alt=\"\" width=\"970\" height=\"647\" />\r\n\r\nCurata da <strong>Paolo Marini, Federico Poole e Susanne Töpfer</strong>, curatori del Museo Egizio, la mostra è frutto di un progetto scientifico ideato dal direttore del Museo, <strong>Christian Greco</strong> ed è sostenuta dalla Consulta per la Valorizzazione dei Beni Artistici e Culturali di Torino.\r\n\r\n<strong>Dal 7 dicembre 2022 al 7 settembre 2023.</strong>\r\n\r\nAcquista il biglietto<a href=\"https://egizio.museitorino.it/\"><strong> QUI</strong></a>\r\n\r\n<img class=\" wp-image-6078 aligncenter\" src=\"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-30.jpg\" alt=\"\" width=\"922\" height=\"1152\" />","urlVideo":"","tag":"","seo":{"title":"Il Dono di Thot: leggere l'antico Egitto","description":"Scopri la mostra dedicata alla scrittura egizia"},"highlighedText":"","image":{"id":"6103","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49-1440x959.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49-1654x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2022/12/MicrosoftTeams-image-49.jpg"},"imageTitle":"","current":false,"info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"5998","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22-500x500.png","medium":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22-1024x683.png","medium_large":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22.png","large":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22.png","original":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22.png"},"slug":"attraverso-gli-occhi-di-tutankhamon-prospettive-alternative-sullegittologia","title":"Attraverso gli occhi di Tutankhamon: prospettive alternative sull’egittologia","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1667552400000,"endDate":1677605400000,"isRange":true,"description":"In occasione dell'<strong>anniversario della scoperta della tomba di Tutankhamon</strong>, dal <strong>4 novembre 2022</strong> fino al <strong>28 febbraio 2023</strong>, il Museo Egizio ospita una <strong>mostra di arte contemporanea di </strong><strong>Sara Sallam</strong> (1991), artista egiziana emergente residente nei Paesi Bassi.\r\n\r\n<strong>\"Attraverso gli occhi di Tutankhamon: prospettive alternative sull'egittologia\"</strong> espone tre diversi progetti dell’artista: <strong><em>A Tourist Handbook for Egypt Outside of Egypt</em></strong>, una guida turistica per le vie di Parigi che commemorano i luoghi e le battaglie della spedizione napoleonica in Egitto per cercare di proporre una narrazione storica alternativa a quella dominante occidentale; <strong><i>Home Outside of Home</i></strong>, una serie di stampe in cui  oggetti antichi decontestualizzati in città europee esprimono tutta la loro nostalgia per i luoghi di origine; e<strong> <i>I Prayed For The Resin Not To Melt</i></strong>, un’istallazione video in cui l’artista ci trasporta con forza nella tomba di Tutankhamon, al momento della sua scoperta, ma stravolgendo completamente la prospettiva alla quale siamo assuefatti dalla narrazione mitizzata occidentale della scoperta, focalizzando la nostra attenzione sull’udito anziché sulla vista dei tesori del faraone e restituendoci il punto di vista di Tutankhamon in uno dei momenti più drammatici della propria esistenza dopo la morte.\r\n\r\nLa mostra è <strong>a cura di Sara Sallam e di Paolo Del Vesco, curatore del Museo Egizio.</strong>\r\n\r\nL' <strong>ingresso è gratuito</strong> ed è possibile accedere sia dall’esterno (via Maria Vittoria 3/M) sia dall’atrio principale (via Accademia delle Scienze, 6) del museo.\r\n\r\n<strong>Orari di apertura della mostra: </strong>Lunedì dalle 9.00 alle 13.00; martedì-domenica dalle 9.00 alle 17.30; sabato 5 novembre, in occasione della <strong>Notte delle Arti</strong>, dalle ore 9.00 alle 20.00. La mostra resterà <strong>chiusa</strong> il 15 e 30 novembre e il 6 dicembre 2022.","urlVideo":"","tag":"","seo":null,"highlighedText":"","image":{"id":"5998","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22-500x500.png","medium":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22-1024x683.png","medium_large":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22.png","large":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22.png","original":"https://api.museoegizio.it/wp-content/uploads/2022/10/MicrosoftTeams-image-22.png"},"imageTitle":"","current":false,"info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"5828","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18-1440x995.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18.jpg"},"slug":"il-papiro-dei-re","title":"Il Papiro dei Re","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1664269200000,"endDate":1669055400000,"isRange":true,"description":"Torna in esposizione al Museo Egizio<strong> il Papiro dei Re</strong>, dopo un’opera di ricerca e restauro, frutto di una collaborazione internazionale tra Torino, Copenaghen e Berlino.\r\nIl nuovo allestimento temporaneo, corredato da <strong>strumenti multimediali e infografiche</strong> che rivelano la storia e i contenuti del celebre documento, è visitabile <strong>dal 27 settembre al 21 novembre 2022. </strong>\r\n\r\nNel giorno in cui il mondo dell’egittologia celebra il bicentenario della decifrazione dei geroglifici ad opera di Jean-François Champollion, il Museo Egizio accende i riflettori su uno dei papiri della sua collezione più celebri al mondo, anche noto all’estero con il nome di “Turin King List”. Si tratta dell’<strong>unica lista reale d’epoca faraonica scritta a mano su papiro che sia giunta fino a noi</strong>.\r\n\r\nAlla base del restauro, ci sono gli studi pluriennali dell’egittologo dell’Università di Copenaghen, <strong>Kim Ryholt</strong>, che ha elaborato una nuova ricostruzione del manoscritto, lavorando a stretto contatto con <strong>Rob Demarée</strong>, egittologo dell’Università di Leiden, sotto la supervisione di<strong> Susanne Töpfer</strong>, responsabile della Collezione Papiri del Museo Egizio. A mettere le mani sul Papiro dei Re per 10 settimane a Torino è stata una delle massime esperte al mondo di restauro di papiri, con all’attivo 46 anni di esperienza: <strong>Myriam Krutzsch</strong> dell’Ägyptisches Museum und Papyrussammlung der Stattlichen Museen zu Berlin, museo diretto da <strong>Friederike Seyfried</strong>, membro del comitato scientifico del Museo Egizio, che ha sostenuto il progetto di restauro.\r\n\r\nTutti i frammenti del Papiro dei Re sono stati ripuliti e consolidati da Myriam Krutzsch. Nuovi frammenti, conservati sempre presso la Papiroteca del Museo Egizio, circa una trentina, sono stati inseriti nella trama del manoscritto, mentre alcuni sono stati riposizionati, alla luce dei nuovi studi condotti dal professor Kim Ryholt, grazie al quale l’elenco dei faraoni, in ieratico, distribuiti su 11 colonne, è leggermente mutato.\r\n\r\n<a href=\"https://collezionepapiri.museoegizio.it/it-IT/section/Collezione-Papiri/eb10456f3f324a7493730546ed080456/Highlights-Lista-dei-Re/\"><strong>Clicca QUI</strong></a> per scoprire di più sul Papiro dei Re.\r\n\r\nAcquista il tuo biglietto <a href=\"https://www.museoegizio.it/tickets-shop\"><strong>QUI</strong></a>","urlVideo":"","tag":"","seo":{},"highlighedText":"","image":{"id":"5828","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18-1440x995.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2022/09/MicrosoftTeams-image-18.jpg"},"imageTitle":"","current":false,"info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"5311","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4-1024x792.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4.jpg"},"slug":"aida-figlia-di-due-mondi","title":"AIDA, figlia di due mondi","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1647525600000,"endDate":1654453800000,"isRange":true,"description":"Per celebrare i <strong>150 anni di Aida</strong>, il Museo Egizio racconta la genesi, il contesto storico e le relazioni che hanno accompagnato la nascita dell’opera verdiana, un capolavoro frutto del dialogo fra due mondi, Europa ed Egitto, che la musica unisce sottolineando il legame imprescindibile fra le due sponde opposte del Mediterraneo.\r\n\r\nÈ l’inizio di giugno del 1870 e Giuseppe Verdi accetta dal viceré d’Egitto, Ismail Pascià, un compenso senza precedenti per comporre un’opera lirica, in lingua italiana, ambientata al tempo dei faraoni: <em>Aida</em>.  ​\r\n\r\nCaso unico nella storia della lirica, l’opera è celebrata da due “prime”, al Cairo il 24 dicembre 1871 e a Milano l’8 febbraio 1872, ed è oggi tra i lavori più celebrati di Verdi. ​\r\n\r\nIl progetto culturale,<strong> a cura di Enrico Ferraris</strong>, propone una riflessione critica sul ruolo che il componimento lirico assume nel disegnare l’Egitto moderno.\r\n\r\n<strong>Dal 17 marzo</strong> la mostra <em>AIDA, figlia di due mondi</em> sarà visitabile <strong>fino al 5 giugno</strong> ed è parte di un più ampio <strong>progetto transmediale</strong> ricco di appuntamenti sviluppati in collaborazione con partner che hanno reso possibile l'ampliamento di una esperienza innovativa, molto articolata, che mette in connessione musica, immagini, architettura, cinema, dialoghi e archivi storici, podcast, video e visite guidate: Teatro Regio, Archivio Ricordi, Istituto Nazionale di Studi Verdiani, l’Università di Torino, Aiace, Museo del Cinema, Biblioteca Braidense, Circolo dei Lettori, Libreria Gilibert.\r\n\r\nScopri di più sul progetto transmediale <a href=\"https://aida.museoegizio.it/\"><strong>qui</strong></a>","urlVideo":"","tag":"","seo":{},"highlighedText":"","image":{"id":"5311","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4-1024x792.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2022/03/MicrosoftTeams-image-4.jpg"},"imageTitle":"","current":false,"info":{"top":[{"icon":"lingua","title":"","description":"","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"4691","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388-1440x975.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388.jpg"},"slug":"liberi-di-imparare-2","title":"Liberi di imparare 2","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1620896400000,"endDate":1626631200000,"isRange":true,"description":"Il Museo Egizio presenta al pubblico <strong>una nuova mostra frutto del progetto “Liberi di imparare”</strong>, nato nel 2018 dalla collaborazione del Museo con la Direzione della Casa Circondariale ‘Lorusso-Cutugno’ e l’Ufficio della Garante dei diritti delle persone private della libertà del Comune di Torino.\r\n\r\n<strong>Dal 13 maggio al 18 luglio 2021</strong> il pubblico potrà visitare, in una sala dedicata al secondo piano, un’esposizione di <strong>venti copie di altrettanti reperti della collezione torinese, realizzati dai detenuti delle sezioni scolastiche della Casa Circondariale dell’Istituto tecnico “Plana” e del Primo Liceo Artistico</strong>. La mostra ospita in particolare copie di alcuni capolavori della collezione del Museo Egizio: tra questi la Cappella di Maia, gli affreschi della tomba di Iti e Neferu, i ritratti del Fayyum, l’ostrakon della ballerina, nonché alcuni libri funerari. Gli oggetti riprodotti sono accompagnati da didascalie con le indicazioni che consentono ai visitatori di ritrovare gli originali all’interno della collezione principale del museo.\r\n\r\nAnche nei mesi difficili della pandemia il progetto è proseguito grazie all’impegno di tutte le istituzioni coinvolte: sono state sviluppate nuove modalità di lavoro che hanno permesso ai detenuti coinvolti di proseguire l’attività, realizzando repliche di grandissima qualità. Queste copie, tecnicamente ineccepibili e risultato di un lavoro svolto con passione, assolvono anche a un importante compito educativo e scientifico, a supporto delle attività dentro e fuori il Museo: tra le iniziative in cui sono state utilizzate vale la pena di citare la mostra itinerante “Papirotour” realizzata in collaborazione con le Biblioteche civiche torinesi, le attività di didattica svolte presso l’ospedale infantile di Torino “Regina Margherita”, nonchè alcune <em>handling sessions</em>, ossia esperienze di manipolazione e di studio di reperti, previste per i prossimi mesi.\r\n\r\nIl <strong>progetto “Liberi di imparare”</strong>, è frutto di una collaborazione del Museo con la direzione della Casa Circondariale “Lorusso-Cotugno” e l'Ufficio della Garante dei diritti delle persone private della libertà personale del Comune di Torino. L’Istituto tecnico “Plana” e il Primo Liceo Artistico sono presenti da molti anni con sezioni scolastiche carcerarie presso la Casa Circondariale, dove le classi si sono trasformate dal 2018 in laboratori che hanno coinvolto i detenuti nella realizzazione e decorazione di repliche di reperti della collezione del Museo.\r\n\r\nQuesta è la seconda edizione della mostra “Liberi di imparare”, aperta per la prima volta nel dicembre 2018 presso il Museo Egizio e che ha fatto tappa anche presso la Caffetteria del Palazzo di Giustizia “Bruno Caccia” nel febbraio 2019.\r\n\r\n[gallery columns=\"1\" link=\"none\" size=\"large\" ids=\"4689,4690,4691\"]","urlVideo":"","tag":"","seo":null,"highlighedText":"","image":{"id":"4691","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388-500x500.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388-1024x1024.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388-1440x975.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388-1920x1080.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2021/05/06V9388.jpg"},"imageTitle":"","current":false,"info":{"top":[{"icon":"calendar","title":"Liberi di imparare 2","description":"Dal 13 maggio al 18 luglio 2021","check":true}],"bottom":[{"icon":"email","title":"info@museitorino.it","description":null,"check":true},{"icon":"phone","title":"011 44 06 903","description":"Dal lunedì al sabato dalle ore 9:00 alle 18:00","check":true}]}},{"headerImage":{"id":"9067","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2023/10/MicrosoftTeams-image-24-1-scaled.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2023/10/MicrosoftTeams-image-24-1-scaled.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2023/10/MicrosoftTeams-image-24-1-scaled.jpg","large":"https://api.museoegizio.it/wp-content/uploads/2023/10/MicrosoftTeams-image-24-1-scaled.jpg","original":"https://api.museoegizio.it/wp-content/uploads/2023/10/MicrosoftTeams-image-24-1-scaled.jpg"},"slug":"nel-laboratorio-dello-studioso","title":"Nel laboratorio dello studioso","subtitle":"","titleImage":{"small":"","medium":"","medium_large":"","large":"","original":""},"extraButton":{"title":"","link":"","target":""},"extraButton_title":null,"extraButton_link":null,"extraButton_target":"_self","startDate":1619427600000,"endDate":1704047400000,"isRange":false,"description":"Apre al pubblico <strong>lunedì 26 aprile</strong> il nuovo progetto espositivo <strong>“Nel laboratorio dello studioso”</strong>, un <strong>ciclo di mostre bimestrali</strong> per mettere sotto la lente di ingrandimento una serie di reperti della collezione e offrire ai visitatori un approfondimento inedito sulle storie che custodiscono e sulle ricerche realizzate.\r\n\r\nOgni due mesi la mostra sarà dedicata a un reperto diverso, che verrà indagato dal punto di vista archeologico, storico, attraverso studi e analisi, e in collegamento con altri oggetti. A rimanere sempre al centro della scena sarà invece la ricerca: “Nel laboratorio dello studioso” nasce infatti con lo scopo di<strong> avvicinare il visitatore all’attività scientifica che quotidianamente si svolge sugli oggetti esposti nelle sale e custoditi nei magazzini del Museo Egizio.</strong>\r\n\r\nQui di seguito il calendario delle prossime mostre che saranno realizzate nello spazio de “Nel laboratorio dello studioso”:\r\n<ul>\r\n \t<li>  LUGLIO-AGOSTO 2021 : <a href=\"https://museoegizio.it/esplora/notizie/ad-astra-la-decifrazione-della-tavola-stellare-di-mereru-dal-2-luglio-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"><span style=\"text-decoration: underline;\"><em>Ad Astra, la decifrazione della tavola stellare di Mereru </em></span></a>(a cura di Enrico Ferraris)</li>\r\n \t<li>3 SETTEMBRE- 1 NOVEMBRE 2021 :  <em><a href=\"https://museoegizio.it/esplora/notizie/figli-di-horus-proteggete-questo-ushabti-il-modellino-di-sarcofago-di-kha-dal-3-settembre-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\">Figli di Horus proteggete questo ushabti! Il modellino di sarcofago di Kha</a> </em>(a cura di Paolo Marini)</li>\r\n \t<li>8 NOVEMBRE 2021 - 9 GENNAIO 2022 : <a href=\"https://museoegizio.it/esplora/notizie/gatti-falchi-anguille-i-bronzi-votivi-per-mummie-animali-dall8-novembre-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"><em>Gatti, falchi e anguille. I bronzi votivi per mummie animali</em> (a cura di Johannes Auenmueller)</a></li>\r\n \t<li>14 GENNAIO - 20 MARZO 2022 : <a href=\"https://museoegizio.it/esplora/notizie/un-santuario-portatile-per-la-dea-anuket-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"><em>Un santuario portatile per la dea Anuket</em> </a>(a cura di Paolo Del Vesco)</li>\r\n \t<li>25 MARZO - 5 GIUGNO 2022 :<a href=\"https://www.museoegizio.it/esplora/notizie/il-libro-dei-morti-di-baki-lo-scriba-del-signore-delle-due-terre-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"><em> Il Libro dei Morti di Baki, Scriba del Signore delle Due Terre</em></a> (a cura di Susanne Töpfer e Sara Demichelis)</li>\r\n \t<li>13 GIUGNO - 21 AGOSTO 2022: <em><a href=\"https://www.museoegizio.it/esplora/notizie/il-vaso-bes-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\">Il vaso Bes</a> </em>(a cura di Federica Facchetti)</li>\r\n \t<li>26 AGOSTO - 30 OTTOBRE 2022: <a href=\"https://www.museoegizio.it/esplora/notizie/champollion-e-torino-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"><em>Champollion e Torino </em></a>(a cura di Beppe Moiso e Tommaso Montonati)</li>\r\n \t<li>7 NOVEMBRE - 8 GENNAIO 2023: <a href=\"https://www.museoegizio.it/esplora/notizie/esplorare-il-mondo-della-magia-amuleti-e-faience%e2%80%af-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"><em>Esplorare il mondo della magia: amuleti e faïence</em></a> (a cura di Martina Terzoli)</li>\r\n \t<li>13 GENNAIO - 19 MARZO 2023:<a href=\"https://www.museoegizio.it/esplora/notizie/sedersi-allegramente-davanti-al-dio-le-cappelle-votive-di-deir-el-medina/\"><em> Sedersi allegramente davanti al dio: i sedili votivi in pietra di Deir el-Medina </em></a>(a cura di Cédric Gobeil)</li>\r\n \t<li>24 MARZO - 28 MAGGIO 2023: <em><a href=\"https://www.museoegizio.it/esplora/notizie/baciare-la-terra-per-il-signore-degli-dei-la-statua-stelofora-di-neferhebef-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\">Baciare la terra per il signore degli dei: la statua stelofora di Neferhebef</a> </em>(a cura di Alessandro Girardi)</li>\r\n \t<li>2 GIUGNO 2023 - 6 AGOSTO 2023:<a href=\"https://www.museoegizio.it/esplora/notizie/frammenti-di-storia-eliopoli-si-racconta-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"> <em>Frammenti di storia: Eliopoli si racconta </em></a>(a cura di Federica Ugliano)</li>\r\n \t<li>11 AGOSTO 2023 - 15 OTTOBRE 2023: <a href=\"https://www.museoegizio.it/esplora/notizie/un-falso-autentico-la-statua-di-neshor-la-nuova-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"><em>Un falso autentico: la statua di Neshor </em></a>(a cura di Maxence Garde, Matteo Lombardi, Federico Poole)</li>\r\n \t<li>20 OTTOBRE 2023 - 31 DICEMBRE 2023: <a href=\"https://www.museoegizio.it/esplora/notizie/cose-il-cartonnage-conservazione-e-studio-delle-coperture-per-mummia-la-nuova-e-ultima-mostra-del-ciclo-nel-laboratorio-dello-studioso/\"><em>Cos'è il cartonnage? Conservazione e studio delle coperture per mummia </em></a>(a cura di Alessia Fassone e Sara Aicardi)</li>\r\n</ul>\r\n<a href=\"https://youtube.com/playlist?list=PLg2dFdDRRClFHNP35-oZigDVuGH79rxP5\"><strong>Ascolta le interviste ai curatori delle esposizioni</strong></a>\r\n\r\n<img class=\"alignnone size-full wp-image-4635\" src=\"https://api.museoegizio.it/wp-content/uploads/2021/04/Nel-laboratorio-dello-studioso_copertina.jpg\" alt=\"\" width=\"5000\" height=\"2625\" />","urlVideo":"","tag":"","seo":null,"highlighedText":"","image":{"id":"9067","alt":"","small":"https://api.museoegizio.it/wp-content/uploads/2023/10/MicrosoftTeams-image-24-1-scaled.jpg","medium":"https://api.museoegizio.it/wp-content/uploads/2023/10/MicrosoftTeams-image-24-1-scaled.jpg","medium_large":"https://api.museoegizio.it/wp-content/uploads/2023/10
